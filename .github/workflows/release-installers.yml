name: Release Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-python-package:
    name: Build Python package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build wheel and sdist
        run: |
          python -m build

      - name: Validate package metadata
        run: |
          python -m twine check dist/*

      - name: Upload Python artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  build-windows-installer:
    name: Build windows-x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Build binary (Windows)
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name emacs-a11y `
            --collect-data emacs_a11y `
            --collect-data emacs_a11y.resources `
            src/emacs_a11y/cli/doctor.py

      - name: Smoke test binary (Windows)
        shell: pwsh
        run: |
          .\dist\emacs-a11y.exe --help
          .\dist\emacs-a11y.exe doctor --help

      - name: Package installer asset (Windows)
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $stageDir = "package-windows-x64"
          $asset = "emacs-a11y-$tag-windows-x64.zip"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item "dist/emacs-a11y.exe" "$stageDir/emacs-a11y.exe"
          Copy-Item "README.md" "$stageDir/README.md"
          Compress-Archive -Path "$stageDir/*" -DestinationPath $asset -Force
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ${{ env.ASSET }}

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-python-package
      - build-windows-installer

    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true

  publish-pypi:
    name: Publish package to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-python-package
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/emacs-a11y-installer

    steps:
      - name: Download Python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
