name: Release Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installers:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            binary_name: emacs-a11y
            archive_ext: tar.gz
          - os: macos-13
            platform: macos-x64
            binary_name: emacs-a11y
            archive_ext: tar.gz
          - os: windows-latest
            platform: windows-x64
            binary_name: emacs-a11y.exe
            archive_ext: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Build binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name emacs-a11y \
            --collect-data emacs_a11y \
            --collect-data emacs_a11y.resources \
            src/emacs_a11y/cli/doctor.py

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name emacs-a11y `
            --collect-data emacs_a11y `
            --collect-data emacs_a11y.resources `
            src/emacs_a11y/cli/doctor.py

      - name: Smoke test binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./dist/emacs-a11y --help
          ./dist/emacs-a11y doctor --help

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\dist\emacs-a11y.exe --help
          .\dist\emacs-a11y.exe doctor --help

      - name: Package installer asset (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          STAGE_DIR="package-${{ matrix.platform }}"
          ASSET="emacs-a11y-${TAG}-${{ matrix.platform }}.${{ matrix.archive_ext }}"
          mkdir -p "$STAGE_DIR"
          cp "dist/${{ matrix.binary_name }}" "$STAGE_DIR/"
          cp README.md "$STAGE_DIR/"
          tar -czf "$ASSET" -C "$STAGE_DIR" .
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"

      - name: Package installer asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $stageDir = "package-${{ matrix.platform }}"
          $asset = "emacs-a11y-$tag-${{ matrix.platform }}.${{ matrix.archive_ext }}"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item "dist/${{ matrix.binary_name }}" "$stageDir/${{ matrix.binary_name }}"
          Copy-Item "README.md" "$stageDir/README.md"
          Compress-Archive -Path "$stageDir/*" -DestinationPath $asset -Force
          "ASSET=$asset" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload packaged installer
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ env.ASSET }}

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-installers

    steps:
      - name: Download packaged installers
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
