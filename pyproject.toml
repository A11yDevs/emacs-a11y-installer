[build-system]
requires = ["hatchling>=1.24.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "emacs-a11y-installer"
dynamic = ["version"]
description = "Accessible CLI installer tooling for Emacs Acessivel"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "A11yDevs" }
]
license = { text = "MIT" }
dependencies = [
  "typer>=0.12.3"
]

[project.urls]
Homepage = "https://github.com/A11yDevs/emacs-a11y-installer"
Repository = "https://github.com/A11yDevs/emacs-a11y-installer"
Issues = "https://github.com/A11yDevs/emacs-a11y-installer/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "jsonschema>=4.23.0"
]

[project.scripts]
emacs-a11y = "emacs_a11y.cli.doctor:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/emacs_a11y"]
include = [
  "src/emacs_a11y/resources/**/*.el"
]
